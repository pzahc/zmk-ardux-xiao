# Combo settings required by ARDUX
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=24
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# Bluetooth profiles
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# No display
CONFIG_ZMK_DISPLAY=n

# Keep awake for testing (disable sleep)
CONFIG_ZMK_SLEEP=n

# Enables mouse functionality (required by ardux.dtsi mouse layer)
CONFIG_ZMK_POINTING=y

# WS2812B LED strip via SPI (driven by custom per-key LED driver, not ZMK underglow)
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# Battery reporting (needed for battery level display on LEDs)
CONFIG_ZMK_BATTERY_REPORTING=y

# USB CDC ACM Logging
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_INF=y
CONFIG_LOG_BACKEND_UART=y

# Enable USB Bootloader on double tap of reset button
CONFIG_ZMK_USB_BOOT=y

CONFIG_ZMK_USB=y
